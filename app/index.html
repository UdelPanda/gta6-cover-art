<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Neon Coast Cover Studio</h1>
    <p class="tag">Your photo, a caption, and a poster — in the spirit of a Vice City sunset. Photos never leave this machine.</p>

    <fieldset>
      <legend>Layout</legend>
      <div class="row">
        <button type="button" data-layout="hero" class="active">Hero</button>
        <button type="button" data-layout="grid">Grid</button>
        <button type="button" data-layout="trio">Trio</button>
        <button type="button" data-layout="solo">Solo</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div class="row">
        <button type="button" data-grade="sunset" class="active">Sunset</button>
        <button type="button" data-grade="neon">Neon Night</button>
        <button type="button" data-grade="day">Day</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Caption</legend>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="60" value="Every sunset has a price"></label>
      <label class="check"><input id="caption-gradient" type="checkbox" checked> Sunset gradient lettering</label>
    </fieldset>

    <fieldset>
      <legend>Panels — click a panel in the preview, then pick its photo</legend>
      <div id="panel-list"></div>
      <div class="row">
        <button type="button" data-sample="pier">Sample: Pier</button>
        <button type="button" data-sample="boulevard">Sample: Boulevard</button>
      </div>
      <div class="row">
        <button type="button" id="fill-all">Fill all panels with this photo</button>
        <button type="button" id="reset-crop">Reset crop</button>
      </div>
      <label>Zoom <input id="zoom" type="range" min="50" max="400" value="100"> <span class="hint">drag the preview to pan, scroll to zoom</span></label>
    </fieldset>

    <fieldset>
      <legend>Effects</legend>
      <label class="check"><input type="checkbox" data-effect="halftone" checked> Halftone dots</label>
      <label class="check"><input type="checkbox" data-effect="grain" checked> Grain</label>
      <label class="check"><input type="checkbox" data-effect="vignette" checked> Vignette</label>
      <label class="check"><input type="checkbox" data-effect="shadows" checked> Panel shadows</label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div class="row">
        <button type="button" data-size="square">Square</button>
        <button type="button" data-size="portrait">Portrait</button>
        <button type="button" data-size="wide" class="active">Wide</button>
      </div>
      <div class="row">
        <button type="button" data-export="square">PNG 1080 x 1080</button>
        <button type="button" data-export="portrait">PNG 1080 x 1350</button>
        <button type="button" data-export="wide">PNG 1920 x 1080</button>
      </div>
      <button type="button" id="export-all" class="primary">Export all three sizes</button>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <canvas id="cover" width="880" height="495" aria-label="The cover preview"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
